<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Hole — Portal</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-layer bg-parallax-1"></div>
  <div class="bg-layer bg-parallax-2"></div>
  <div class="bg-layer bg-parallax-3"></div>
  <div class="noise-overlay"></div>
  <div class="bg-aurora"></div>
  <div class="floating-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <canvas id="particles"></canvas>
  <div class="cursor-glow" id="cursorGlow"></div>

  <header class="top-bar">
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
      <span class="menu-icon">
        <span></span><span></span><span></span>
      </span>
    </button>
    <h1 class="site-title">
      <span class="title-glow">WHITE</span>
      <span class="title-hole">HOLE</span>
    </h1>
    <div class="top-bar-spacer"></div>
    <button class="theme-toggle top-theme" id="themeToggle" aria-label="Cambiar tema">
      <span class="theme-icon sun"><img src="assets/images/icons/sun.svg" alt=""></span>
      <span class="theme-icon moon"><img src="assets/images/icons/moon.svg" alt=""></span>
    </button>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
      <div class="sidebar-header">
        <div class="logo-mark">
          <div class="logo-ring"></div>
          <div class="logo-core"></div>
        </div>
        <span class="sidebar-brand">WH</span>
      </div>
      <nav class="side-nav">
        <a href="index.html" class="side-link active" data-page="home">
          <span class="side-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
          </span>
          <span class="side-text">Inicio</span>
          <span class="side-indicator"></span>
        </a>
        <a href="pages/novel.html" class="side-link" data-page="novel">
          <span class="side-icon">
            <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h8"/></svg>
          </span>
          <span class="side-text">Novela Web</span>
          <span class="side-indicator"></span>
        </a>
        <a href="pages/library.html" class="side-link" data-page="library">
          <span class="side-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </span>
          <span class="side-text">Biblioteca</span>
          <span class="side-indicator"></span>
        </a>
</nav>
      <div class="sidebar-footer">
        <div class="version-tag">v3.0 • VOID</div>
      </div>
    </div>
  </aside>

  <main class="main-content home-main">
    <section class="blackhole-section">
      <div class="blackhole-container">
        <div class="event-horizon"></div>
        <div class="accretion-disk"></div>
        <div class="accretion-disk disk-2"></div>
        <div class="singularity"></div>
        <div class="photon-ring"></div>
        <div class="gravitational-lensing"></div>
      </div>
      <div class="home-content">
        <h2 class="home-title">
          <span class="line">BIENVENIDO AL</span>
          <span class="line accent">WHITE HOLE</span>
        </h2>
        <p class="home-sub">Un portal de contenido original · Novelas · Anime · Redes</p>
        <div class="home-actions">
          <a href="pages/novel.html" class="btn-primary large">
            <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M8 7h8M8 11h8"/></svg>
            <span>Leer Novela</span>
            <span class="btn-shine"></span>
          </a>
          <a href="pages/library.html" class="btn-outline large">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>Biblioteca Anime</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">WHITE HOLE</span>
      <span class="footer-sep">•</span>
      <span class="footer-copy">Portal de contenido</span>
    </div>
    <div class="footer-social">
      <a href="https://discord.gg/J6RV8sxkGP" target="_blank" rel="noopener" class="social-link" data-brand="discord" title="Discord" aria-label="Discord">
        <img src="assets/images/icons/discord.svg" alt="">
        <span class="social-label">Discord</span>
      </a>
      <a href="https://myanimelist.net/profile/Dakzan" target="_blank" rel="noopener" class="social-link" data-brand="mal" title="MyAnimeList" aria-label="MyAnimeList">
        <img src="assets/images/icons/mal.svg" alt="">
        <span class="social-label">MAL</span>
      </a>
      <a href="https://getinkspired.com/es/u/dakzan/" target="_blank" rel="noopener" class="social-link" data-brand="novela" title="Novela" aria-label="Novela">
        <img src="assets/images/icons/book.svg" alt="">
        <span class="social-label">Novela</span>
      </a>
      <a href="https://www.tiktok.com/@dakzan04" target="_blank" rel="noopener" class="social-link" data-brand="tiktok" title="TikTok" aria-label="TikTok">
        <img src="assets/images/icons/tiktok.svg" alt="">
        <span class="social-label">TikTok</span>
      </a>
      <a href="https://x.com/dakzan04" target="_blank" rel="noopener" class="social-link" data-brand="twitter" title="X / Twitter" aria-label="X">
        <img src="assets/images/icons/x.svg" alt="">
        <span class="social-label">Twitter</span>
      </a>
      <a href="https://www.youtube.com/@dakzan" target="_blank" rel="noopener" class="social-link" data-brand="youtube" title="YouTube" aria-label="YouTube">
        <img src="assets/images/icons/youtube.svg" alt="">
        <span class="social-label">YouTube</span>
      </a>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
